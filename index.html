<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>augmented_reality</title>
</head>

<body>
  <div id="app">
    <!-- Estructura FIJA: siempre hay exactamente un boton y un mensaje.
         Por eso viven en el HTML y no se crean desde JavaScript.
         El texto de aqui es solo el valor inicial; en cuanto main.ts arranca,
         renderUI() lo sobrescribe segun el estado real. -->
    <button id="camera-button" type="button"></button>

    <!-- Aqui van los mensajes de error para el usuario. Vacio = no hay nada
         que decir. Existe siempre, aunque este vacio: asi renderUI() puede
         escribir en el sin comprobar si existe. -->
    <p id="status"></p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
